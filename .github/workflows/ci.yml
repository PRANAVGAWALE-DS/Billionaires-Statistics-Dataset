name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Single-thread BLAS/OpenMP globally — prevents KMeans deadlocks in CI
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  ci:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # FIX H8 — test all Python versions advertised in pyproject.toml
      # (requires-python = ">=3.10").  fail-fast: false lets all versions
      # run to completion so version-specific failures are all visible at once.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + api + dev dependencies
        # FIX H6 — include [api] so fastapi, uvicorn, pydantic are available
        # in CI.  Without this, any test or import touching api/ fails with
        # ImportError.  [dev] brings pytest, pytest-cov, and ruff.
        run: pip install -e ".[api,dev]"

      - name: Lint — ruff check
        # FIX H6 — extend lint scope to cover api/ and app.py.
        # pyproject.toml already declares a valid ruff override for app.py:E402
        # (sys.path bootstrap guards), so linting it will not produce false positives.
        run: ruff check src/ tests/ api/ app.py

      - name: Lint — ruff format check
        run: ruff format --check src/ tests/ api/ app.py

      - name: Test — pytest with coverage
        # FIX M10 — measure coverage and enforce a minimum threshold.
        # --cov-fail-under=70 catches regressions where new code is added
        # without tests.  Coverage config lives in pyproject.toml
        # ([tool.pytest.ini_options] addopts).
        run: pytest tests/ -v --tb=short --cov=src/billionaires --cov-report=term-missing --cov-fail-under=70s