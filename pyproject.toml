[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "billionaires"
version         = "1.0.0"
description     = "Advanced EDA & ML pipeline — Billionaires Statistics Dataset"
requires-python = ">=3.10"
dependencies    = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "optuna>=3.4",
    "shap>=0.44",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "missingno>=0.5",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "nbformat>=5.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]          # line-length already enforced by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"